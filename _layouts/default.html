<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | remove: '**' | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <script>
    try {
      const saved = localStorage.getItem('appearance');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {% if page.math %}
  <script src="{{ '/assets/math-config.js' | relative_url }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
  {% endif %}
  {% if page.audio %}<script src="{{ '/assets/audio-player.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-shell">
    {% include header.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
  </div>
</body>
</html>
