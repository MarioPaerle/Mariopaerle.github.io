title: Paerle
description: Projects and notes on mathematics, artificial intelligence and music.
url: https://mariopaerle.github.io
baseurl: ""
markdown: kramdown
highlighter: rouge
permalink: /writing/:title/
kramdown:
  input: GFM
  math_engine: null
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gems
  - vendor
  - .bundle
  - preview
  - post-template.txt
  - scripts
